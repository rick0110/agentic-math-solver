<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <defs>
    <!-- Gradiente com brilho sutil em tom de grafite que passara pelos pontos -->
    <linearGradient id="shineGradient" x1="-100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000000" stop-opacity="1" />
      <stop offset="35%" stop-color="#000000" stop-opacity="1" />
      <stop offset="50%" stop-color="#2a2a2a" stop-opacity="0.3" /> <!-- Brilho -->
      <stop offset="65%" stop-color="#000000" stop-opacity="1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="1" />

      <animate attributeName="x1" from="-100%" to="200%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <!-- Máscara de texto: recorta os pontos para formarem a palavra rick0110 -->
    <clipPath id="textClip">
      <text x="250" y="135" text-anchor="middle" font-family="'Arial Black', Impact, 'Segoe UI Black', sans-serif" font-size="95px" font-weight="900" letter-spacing="-3px">rick0110</text>
    </clipPath>
  </defs>

  <!-- Grupo clipado pelo texto: todos os pontos aqui dentro só aparecem onde tem letra -->
  <g clip-path="url(#textClip)">

    <!-- Camada de pontos centrais (Maiores) -->
    <mask id="centerMask">
      <rect width="100%" height="100%" fill="url(#radialCenter)" />
    </mask>
    <radialGradient id="radialCenter" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>

    <pattern id="dotsBig" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="3.5" fill="url(#shineGradient)">
        <animate attributeName="r" values="2.5; 4.0; 2.5" dur="1.2s" repeatCount="indefinite" />
      </circle>
    </pattern>
    <rect width="100%" height="100%" fill="url(#dotsBig)" mask="url(#centerMask)" />

    <!-- Camada de pontos periféricos (Menores) -->
    <mask id="periphMask">
      <rect width="100%" height="100%" fill="url(#radialPeriph)" />
    </mask>
    <radialGradient id="radialPeriph" cx="50%" cy="50%" r="65%">
      <stop offset="40%" stop-color="#000000"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </radialGradient>

    <pattern id="dotsSmall" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="url(#shineGradient)">
        <animate attributeName="r" values="1.0; 2.2; 1.0" dur="1.7s" repeatCount="indefinite" />
      </circle>
    </pattern>
    <rect width="100%" height="100%" fill="url(#dotsSmall)" mask="url(#periphMask)" />

  </g>
</svg>
